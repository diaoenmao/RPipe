name: Temporary cache boundary diagnostic
on:
  push:
    branches: [codex/cache-lock-budget]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v7
      - name: Fetch and verify the exact production baseline
        run: |
          git fetch --no-tags --depth=1 origin 9324014985680a0d186863cd135faa53a2e7bcbf
          if ($LASTEXITCODE -ne 0) { throw 'baseline fetch failed' }
          git diff --exit-code 9324014985680a0d186863cd135faa53a2e7bcbf -- src
          if ($LASTEXITCODE -ne 0) { throw 'production differs from baseline' }
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Reproduce invalid budgets with bounded watchdog and check new boundaries
        run: >-
          python tests/run.py --all --
          tests/rpipe/structure/artifact/test_shared.py
          tests/rpipe/structure/artifact/test_atomic_boundaries.py
          --basetemp=.tmp/cache-budget-baseline-${{ github.run_id }} --durations=10
