study: mnist_native_vs_hf
description: Same MNIST linear recipe — custom_torch vs transformers_trainer

experiment:
  name: mnist_linear

fixed:
  data:
    name: MNIST
    source: torch
    config:
      batch_size: 64
  model:
    name: linear
  algorithm:
    mode: train
    num_epochs: 20
    progress_unit: epoch
    eval_period: 1
    checkpoint: latest
    checkpoint_period: 1
    save_best: true
    optimizer: SGD
    max_grad_norm: 0
    lr: 0.1
    scheduler: cosine
    eta_min: 0.0
  system:
    device: cpu
    deterministic: false
    cudnn_benchmark: true

# 2 sources × 3 train_size × 3 seeds = 18 Runs. custom_torch 在前，便于对照。
axes:
  algorithm.source: [custom_torch, transformers_trainer]
  data.config.train_size: [500, 2000, 8000]

seeds: [0, 1, 2]

tags:
  - when:
      algorithm.source: custom_torch
      data.config.train_size: 500
    tags: [baseline]

run_description: "source={source} train_size={train_size} seed={seed}"
