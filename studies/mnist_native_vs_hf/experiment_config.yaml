experiment: mnist_linear
description: MNIST linear — native loop vs HuggingFace Trainer (same algorithm keys)
data:
  name: MNIST
  source: torch
  config:
    train_size: 1000
    batch_size: 64
model:
  name: linear
algorithm:
  source: custom_torch
  mode: train
  num_epochs: 20
  progress_unit: epoch
  eval_period: 1
  checkpoint: latest
  checkpoint_period: 1
  save_best: true
  optimizer: SGD
  max_grad_norm: 0
  lr: 0.1
  scheduler: cosine
  eta_min: 0.0
system:
  device: cpu
  deterministic: false
  cudnn_benchmark: true
