study: vision_main_recipe
description: Main-branch vision grid — CIFAR10/SVHN × linear/mlp/cnn/resnet18, 400 epochs on CUDA

experiment:
  name: vision_main

fixed:
  data:
    source: torch
    config:
      batch_size: 250
      test_batch_ratio: 4
  model:
    source: custom_torch
  algorithm:
    source: custom_torch
    mode: train
    num_epochs: 400
    progress_unit: epoch
    eval_period: 1
    checkpoint: latest
    checkpoint_period: 1
    save_best: true
    best_metric: Loss
    best_mode: min
    optimizer: SGD
    momentum: 0.9
    nesterov: true
    weight_decay: 5.0e-4
    max_grad_norm: 0
    lr: 0.1
    scheduler: cosine
    eta_min: 0.0
  system:
    device: cuda
    deterministic: false
    cudnn_benchmark: true

# 8 Run。axes 顺序 = make 展开顺序 = --round 切组顺序。
# model 在前：同一 round 里是「同模型 × 两个数据集」，墙钟接近，避免 linear 和 resnet 绑在一组 wait。
# 1 卡：make 默认 --round auto（按最重格子与显存估）。多卡：--num-gpus N。
axes:
  model.name: [linear, mlp, cnn, resnet18]
  data.name: [CIFAR10, SVHN]

seeds: [0]

tags:
  - when:
      data.name: CIFAR10
      model.name: linear
    tags: [baseline]

run_description: "{data_name}_{model_name} seed={seed}"
