experiment: local_model_matrix
description: MNIST and CIFAR10 CNN/resnet18 at a shared 600-step recipe
data:
  name: MNIST
  source: torch
  config:
    batch_size: 250
    test_batch_ratio: 4
    pin_memory: true
    num_workers: 0
    augment: true
model:
  name: cnn
algorithm:
  source: custom_torch
  mode: train
  num_steps: 600
  progress_unit: step
  log_period: 10
  eval_period: 30
  eval_num_steps: -1
  checkpoint: latest
  checkpoint_period: 30
  save_best: true
  best_metric: Loss
  best_split: test
  optimizer: SGD
  lr: 0.03
  momentum: 0.9
  weight_decay: 0.0005
  nesterov: true
  max_grad_norm: 0
  scheduler: cosine
  eta_min: 0.0
system:
  device: cuda
  deterministic: false
  cudnn_benchmark: true
