# study.yaml template — copy into studies/<your_study>/

study: my_study
description: one-line goal for humans and agents

experiment:
  name: mnist_linear

fixed:
  seed: 0
  data:
    name: MNIST
    source: torch
    config:
      batch_size: 64
  model:
    name: linear
  algorithm:
    mode: train
    num_epochs: 2
    lr: 0.1
  system:
    device: cpu

axes:
  data.config.train_size: [500, 2000, 8000]

tags:
  - when:
      data.config.train_size: 500
    tags: [baseline]

run_description: "{experiment} train_size={train_size}"
