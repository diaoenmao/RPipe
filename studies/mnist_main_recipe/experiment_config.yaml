experiment: mnist_linear
description: Main-branch MNIST_linear recipe (step budget + SGD extras)
data:
  name: MNIST
  source: torch
  config:
    batch_size: 250
    test_batch_ratio: 4
model:
  name: linear
  config:
    zero_bias: true
algorithm:
  source: custom_torch
  mode: train
  num_steps: 60
  progress_unit: step
  eval_period: 30
  checkpoint: latest
  checkpoint_period: 30
  save_best: true
  best_metric: Loss
  best_mode: min
  optimizer: SGD
  momentum: 0.9
  nesterov: true
  weight_decay: 5.0e-4
  max_grad_norm: 0
  lr: 0.1
  scheduler: cosine
  eta_min: 0.0
system:
  device: cpu
  deterministic: false
  cudnn_benchmark: true
