study: mnist_seeds
description: MNIST linear — same Experiment factors, multiple seed Runs

experiment:
  name: mnist_linear

fixed:
  data:
    name: MNIST
    source: torch
    config:
      train_size: 1000
      batch_size: 64
  model:
    name: linear
  algorithm:
    mode: train
    num_epochs: 1
    lr: 0.1
  system:
    device: cpu

# One Experiment cell (all factors in fixed); Runs vary by seed
axes: {}

seeds: [0, 1]

tags:
  - when:
      seed: 0
    tags: [baseline]

run_description: "mnist_linear seed={seed}"
