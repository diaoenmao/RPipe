# 基底默认。study.yaml 的 fixed / axes 覆盖同名键。
experiment: main_base
description: main --mode base probe (4 train steps, full images)
data:
  name: MNIST
  source: torch
  config:
    batch_size: 250
    test_batch_ratio: 4
    pin_memory: true
    num_workers: 0
    augment: false
model:
  name: linear
algorithm:
  source: custom_torch
  mode: train
  num_steps: 4
  progress_unit: step
  eval_period: 0
  eval_num_steps: 4
  checkpoint: latest
  checkpoint_period: 30
  save_best: true
  best_metric: Loss
  best_split: test
  optimizer: SGD
  lr: 0.1
  momentum: 0.9
  weight_decay: 0.0005
  nesterov: true
  max_grad_norm: 0
  scheduler: cosine
  eta_min: 0.0
system:
  device: cuda
  deterministic: false
  cudnn_benchmark: true
