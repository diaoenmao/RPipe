# 对照旧 main 98648f3 的 --mode base。格子由 make 展开，不要手写 runs/。
# 探针（4 step）已跑完，旧 Run 保留，记录在 docs/STUDY_REPORT.md。
# 本机 60-step 学习曲线验证轮；每5步完整评测，不等同旧main每30步评测的严格复现。
# 不要把探针和正式规模同时写在 axes 里。

study: main_base
origin: domestic
description: Local 60-step learning curves; full test every 5 steps; train then eval

experiment:
  name: main_base

fixed:
  version: local-curves-20261002
  data:
    source: torch
    config:
      batch_size: 250
      test_batch_ratio: 4
      pin_memory: true
      num_workers: 0
      augment: true
  algorithm:
    source: custom_torch
    mode: train
    num_steps: 60
    progress_unit: step
    log_period: 5
    eval_period: 5
    eval_num_steps: -1
    checkpoint: latest
    checkpoint_period: 30
    save_best: true
    best_metric: Loss
    best_split: test
    optimizer: SGD
    lr: 0.1
    momentum: 0.9
    weight_decay: 0.0005
    nesterov: true
    max_grad_norm: 0
    scheduler: cosine
    eta_min: 0.0
  system:
    device: cuda
    deterministic: false
    cudnn_benchmark: true

axes:
  data.name: [MNIST, CIFAR10]
  model.name: [linear, mlp, cnn, resnet18]
  algorithm.mode: [train, eval]

seeds: [0]

tags:
  - when:
      data.name: MNIST
      model.name: linear
    tags: [baseline]

run_description: "data={data_name} model={model_name} mode={mode} seed={seed}"
