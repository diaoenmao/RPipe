experiment: mnist_linear
description: MNIST linear classifier (train + test accuracy)
data:
  name: MNIST
  source: torch
  config:
    train_size: 1000
    batch_size: 64
model:
  name: linear
algorithm:
  mode: train
  num_epochs: 20
  eval_period: 1
  lr: 0.1
  scheduler: cosine
  eta_min: 0.0
system:
  device: cpu
  deterministic: false
  cudnn_benchmark: true
