study: mnist_train_size
description: MNIST train_size sweep → test accuracy

experiment:
  name: mnist_linear

fixed:
  data:
    name: MNIST
    source: torch
    config:
      batch_size: 64
  model:
    name: linear
  algorithm:
    mode: train
    num_epochs: 2
    eval_period: 1
    lr: 0.1
  system:
    device: cpu

# 3 Experiments × 3 seeds = 9 Runs. train_size 子集是前 N 条，seed 不重抽样。
axes:
  data.config.train_size: [500, 2000, 8000]

seeds: [0, 1, 2]

tags:
  - when:
      data.config.train_size: 500
    tags: [baseline]

run_description: "train_size={train_size} seed={seed}"
