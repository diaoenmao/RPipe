study: mnist_train_size
description: MNIST train_size sweep → test accuracy; independent eval Run loads train best

experiment:
  name: mnist_linear

fixed:
  data:
    name: MNIST
    source: torch
    config:
      batch_size: 64
  model:
    name: linear
  algorithm:
    source: custom_torch
    num_epochs: 20
    progress_unit: epoch
    eval_period: 1
    checkpoint: latest
    checkpoint_period: 1
    save_best: true
    metric:
      train: [Loss, Accuracy]
      test: [Loss, Accuracy]
    optimizer: SGD
    max_grad_norm: 0
    lr: 0.1
    scheduler: cosine
    eta_min: 0.0
  system:
    device: cuda
    deterministic: false
    cudnn_benchmark: true

# 3 train_size × {train, eval} × 3 seeds = 18 Runs。
# 排班（STUDY_GUIDE §3）：全部 train 同一类 linear，auto 装箱叠满再 wait；然后 eval。
# seed 是复测，不是并发。失败记 run_id，整轮后再 resume。
axes:
  data.config.train_size: [500, 2000, 8000]
  algorithm.mode: [train, eval]

seeds: [0, 1, 2]

tags:
  - when:
      data.config.train_size: 500
      algorithm.mode: train
    tags: [baseline]

run_description: "train_size={train_size} mode={mode} seed={seed}"
