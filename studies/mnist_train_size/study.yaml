# 对照 docs/STUDY_GUIDE.md。格子由 make 展开，不要手写 runs/。

study: mnist_train_size
description: MNIST train_size sweep → test accuracy; independent eval loads train best

experiment:
  name: mnist_linear

fixed:
  data:
    name: MNIST
    source: torch
    config:
      batch_size: 64
  model:
    name: linear
  algorithm:
    source: custom_torch
    num_epochs: 20
    progress_unit: epoch
    eval_period: 1
    checkpoint: latest
    checkpoint_period: 1
    save_best: true
    optimizer: SGD
    max_grad_norm: 0
    lr: 0.1
    scheduler: cosine
    eta_min: 0.0
  system:
    device: cuda
    deterministic: false
    cudnn_benchmark: true

# 3 train_size × {train, eval} × 3 seeds = 18 Runs。
# 排班：同类 linear 装箱；全部 train wait 完再 eval。seed 是复测，不是并发。
axes:
  data.config.train_size: [500, 2000, 8000]
  algorithm.mode: [train, eval]

seeds: [0, 1, 2]

tags:
  - when:
      data.config.train_size: 500
      algorithm.mode: train
    tags: [baseline]

run_description: "train_size={train_size} mode={mode} seed={seed}"
