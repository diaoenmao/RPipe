experiment: checkpoint_recovery
description: Small CPU MNIST run for checkpoint and dependency recovery acceptance
data:
  name: MNIST
  source: torch
  config:
    train_size: 256
    batch_size: 32
    test_batch_ratio: 4
    num_workers: 0
    augment: false
model:
  name: linear
algorithm:
  source: custom_torch
  mode: train
  num_steps: 6
  progress_unit: step
  log_period: 1
  eval_period: 2
  eval_num_steps: 2
  checkpoint: latest
  checkpoint_period: 2
  save_best: true
  best_metric: Loss
  optimizer: SGD
  lr: 0.03
  momentum: 0.9
  scheduler: cosine
  eta_min: 0.0
system:
  device: cpu
  deterministic: true
  cudnn_benchmark: false
