[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpipe"
version = "0.2.0"
description = "Research foundation library: data / model / algorithm / system"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Enmao Diao" }]
dependencies = [
  "matplotlib",
  "numpy",
  "pandas",
  "Pillow",
  "PyYAML",
  "scipy",
  "torch",
  "torchvision",
  "torchinfo",
  "tqdm",
  "kornia",
  "xlsxwriter",
  "tensorboard",
]

[project.optional-dependencies]
# extras named after primary use; packages listed explicitly
nlp = ["transformers", "evaluate", "datasets", "lm_eval", "peft", "modelscope"]
vision = ["timm", "diffusers"]
train = ["accelerate"]
metrics = ["torchmetrics", "evaluate", "lm_eval", "opencompass"]
local_llm = ["ollama", "llama-cpp-python"]
all = [
  "transformers", "evaluate", "datasets", "lm_eval", "peft", "modelscope",
  "timm", "diffusers", "accelerate", "torchmetrics", "opencompass",
  "ollama", "llama-cpp-python",
]
dev = ["pytest>=7.0"]

[project.scripts]
rpipe-run = "experiments.cli:main"

[project.entry-points."rpipe.data"]
native = "rpipe.data.native:NativeDataProvider"
datasets = "rpipe.data.datasets:DatasetsDataProvider"

[project.entry-points."rpipe.model"]
native = "rpipe.model.native:NativeModelProvider"
timm = "rpipe.model.timm:TimmModelProvider"
transformers = "rpipe.model.transformers:TransformersModelProvider"
modelscope = "rpipe.model.modelscope:ModelScopeModelProvider"
peft = "rpipe.model.peft:PeftModelProvider"
ollama = "rpipe.model.ollama:OllamaModelProvider"
gguf = "rpipe.model.gguf:GgufModelProvider"

[project.entry-points."rpipe.algorithm.train"]
native = "rpipe.algorithm.train.native:NativeTrainAlgorithm"
accelerate = "rpipe.algorithm.train.accelerate:AccelerateTrainAlgorithm"

[project.entry-points."rpipe.algorithm.metric"]
native = "rpipe.algorithm.metric.native:NativeMetricAlgorithm"
torchmetrics = "rpipe.algorithm.metric.torchmetrics:TorchMetricsAlgorithm"
evaluate = "rpipe.algorithm.metric.evaluate:EvaluateMetricAlgorithm"
lm_eval = "rpipe.algorithm.metric.lm_eval:LMEvalMetricAlgorithm"
opencompass = "rpipe.algorithm.metric.opencompass:OpenCompassMetricAlgorithm"

[project.entry-points."rpipe.algorithm.generate"]
llama_cpp = "rpipe.algorithm.generate.llama_cpp:LlamaCppGenerateAlgorithm"
diffusers = "rpipe.algorithm.generate.diffusers:DiffusersGenerateAlgorithm"

[project.entry-points."rpipe.system"]
pytorch = "rpipe.system.pytorch:PyTorchSystemProvider"
ggml = "rpipe.system.ggml:GgmlSystemProvider"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["rpipe*", "experiments"]
exclude = ["examples*", "configs*", "output*", "data*", "asset*", "build*", "dist*", "tests*"]

[tool.setuptools.package-data]
rpipe = ["config/*.yaml"]
experiments = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q --tb=short"
filterwarnings = [
  "ignore::DeprecationWarning",
]
markers = [
  "unit: Unit test",
  "integration: Integration test",
  "e2e: End-to-end test",
  "location: Location / structure test",
  "content: Content / functional test",
  "physical: Physical resource test",
  "p1: Priority 1",
  "p2: Priority 2",
  "p3: Priority 3",
  "data_layer: data layer",
  "model_layer: model layer",
  "algorithm_layer: algorithm layer",
  "system_layer: system layer",
  "config_layer: config layer",
  "schema_layer: schema layer",
  "plugins_layer: plugins layer",
  "application_layer: application / experiments layer",
  "runtime: runtime physical trait",
  "memory: memory physical trait",
  "slow: slow test",
  "external: optional third-party / network",
  "gpu: uses CUDA when available",
  "module_registry: module registry",
  "module_provider: module provider",
  "module_trainer: module trainer",
  "feature_smoke: feature smoke",
  "feature_providers: feature providers",
]
