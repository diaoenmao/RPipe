[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpipe"
version = "0.3.0"
description = "Research execution substrate: structure / flow"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Enmao Diao" }]
keywords = ["machine-learning", "research", "experiments", "reproducibility"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "matplotlib",
  "numpy",
  "PyYAML",
  "torch",
  "torchvision",
]

[project.urls]
Documentation = "https://github.com/diaoenmao/RPipe/tree/main/docs"
Issues = "https://github.com/diaoenmao/RPipe/issues"
Repository = "https://github.com/diaoenmao/RPipe"

[project.scripts]
rpipe = "rpipe.flow.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
hf = ["accelerate", "evaluate", "transformers"]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["rpipe*"]
exclude = ["examples*", "output*", "data*", "asset*", "build*", "dist*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --tb=short --strict-markers --basetemp=.tmp/pytest"
cache_dir = ".tmp/pytest-cache"
filterwarnings = [
  "ignore::DeprecationWarning",
]
markers = [
  "unit: unit test",
  "integration: integration test",
  "e2e: end-to-end test",
  "location: location and structure contract",
  "content: semantic and behavior contract",
  "physical: resource metric contract",
  "p1: highest priority",
  "p2: default regression priority",
  "p3: low-frequency or auxiliary",
  "structure_layer: structure column",
  "flow_layer: flow column",
  "module_api: structure.api",
  "module_control: structure.control",
  "module_data: structure.data",
  "module_model: structure.model",
  "module_algorithm: structure.algorithm",
  "module_system: structure.system",
  "module_artifact: structure.artifact",
  "module_make: structure.make",
  "module_cli: flow.cli",
  "module_runner: flow runner / execute",
  "module_process: flow process / collect",
  "runtime: runtime budget",
  "memory: memory budget",
  "slow: long-running",
  "external: network, hub, or extra optional deps",
  "flaky: known unstable",
  "quarantined: isolated from the default gate",
]
