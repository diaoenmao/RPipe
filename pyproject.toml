[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rpipe"
version = "0.3.0"
description = "Research execution substrate: Structure / Flow / Artifact"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Enmao Diao" }]
dependencies = [
  "numpy",
  "PyYAML",
  "torch",
  "torchvision",
  "tqdm",
]

[project.scripts]
rpipe = "rpipe.cli:main"

[project.optional-dependencies]
dev = ["pytest>=7.0"]
nlp = ["transformers", "evaluate", "datasets", "lm_eval", "peft", "modelscope"]
vision = ["timm", "diffusers"]
train = ["accelerate"]
metrics = ["torchmetrics", "evaluate", "lm_eval", "opencompass"]
local_llm = ["ollama", "llama-cpp-python"]
all = [
  "transformers", "evaluate", "datasets", "lm_eval", "peft", "modelscope",
  "timm", "diffusers", "accelerate", "torchmetrics", "opencompass",
  "ollama", "llama-cpp-python",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["rpipe*"]
exclude = ["examples*", "output*", "data*", "asset*", "build*", "dist*", "tests*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q --tb=short"
filterwarnings = [
  "ignore::DeprecationWarning",
]
markers = [
  "unit: Unit test",
  "integration: Integration test",
  "e2e: End-to-end test",
]
